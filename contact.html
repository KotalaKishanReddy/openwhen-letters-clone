<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – openwhen</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/pages.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">openwhen</a>
  <div class="nav-links">
    <a href="/#how">how it works</a>
    <a href="/#faq">faq</a>
    <a href="/" class="btn-nav">get started →</a>
  </div>
</nav>

<main class="page-main">
  <div class="container page-container" style="max-width:640px">
    <h1 class="page-title">say hello 👋</h1>
    <p class="page-subtitle">Have a question, feedback, or just want to share how you used openwhen? We'd love to hear from you.</p>

    <form class="contact-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="name">your name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Alex" required />
      </div>
      <div class="form-group">
        <label for="email">your email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="subject">subject</label>
        <select id="subject" name="subject">
          <option value="general">general question</option>
          <option value="feedback">feedback / suggestion</option>
          <option value="bug">report a bug</option>
          <option value="other">other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">message</label>
        <textarea id="message" name="message" rows="5" placeholder="write your message here..." required></textarea>
      </div>
      <button type="submit" class="btn-primary btn-submit">send message →</button>
      <div id="form-success" class="form-success" style="display:none">✅ Message sent! We'll get back to you soon 💌</div>
    </form>
  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span class="footer-logo">openwhen 💌</span>
    <div class="footer-links">
      <a href="/privacy">privacy</a>
      <a href="/terms">terms</a>
      <a href="/contact">contact</a>
    </div>
    <p class="footer-copy">made with love ✨</p>
  </div>
</footer>

<script>
function handleSubmit(e) {
  e.preventDefault();
  document.querySelector('.contact-form button').disabled = true;
  setTimeout(() => {
    document.getElementById('form-success').style.display = 'block';
    document.querySelector('.contact-form button').style.display = 'none';
  }, 600);
}
</script>
</body>
</html>
